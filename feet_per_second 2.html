<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feet Per Second Calculator</title>
  <style>
    body { font-family: sans-serif; background: #181e24; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
    .container { background: #232b36; padding: 2rem 2.5rem; border-radius: 12px; box-shadow: 0 2px 12px #0004; }
    label { display: block; margin-top: 1rem; font-weight: bold; }
    input[type="number"] { width: 100px; padding: 0.4rem; border-radius: 4px; border: 1px solid #444; background: #222; color: #fff; }
    .result { margin-top: 1.5rem; font-size: 1.2rem; font-weight: bold; }
    button { margin-top: 1.5rem; padding: 0.5rem 1.2rem; border: none; border-radius: 4px; background: #3366ff; color: #fff; font-size: 1rem; cursor: pointer; }
    button:hover { background: #274bb3; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Feet Per Second Calculator</h2>
    <form id="fpsForm" autocomplete="off">
      <label for="distance">Distance (feet):</label>
      <input type="number" id="distance" min="0" step="0.01" required>

      <label for="time">Time (seconds):</label>
      <input type="number" id="time" min="0.01" step="0.01" required>

      <button type="submit">Calculate</button>
    </form>
    <div class="result" id="result"></div>
  </div>
  <div class="container" style="margin-top:2rem;">
    <h2>Time to Travel Calculator</h2>
    <form id="timeForm" autocomplete="off">
      <label for="distance2">Distance (feet):</label>
      <input type="number" id="distance2" min="0" step="0.01" required>

      <label for="fps">Speed (feet/second):</label>
      <input type="number" id="fps" min="0.01" step="0.01" required>

      <button type="submit">Calculate</button>
    </form>
    <div class="result" id="result2"></div>
  </div>
  <script>
    // Feet per second calculator
    const form = document.getElementById('fpsForm');
    const resultDiv = document.getElementById('result');
    form.addEventListener('submit', function(e) {
      e.preventDefault();
      const distance = parseFloat(document.getElementById('distance').value);
      const time = parseFloat(document.getElementById('time').value);
      if (isNaN(distance) || isNaN(time) || time <= 0) {
        resultDiv.textContent = 'Please enter valid numbers.';
        return;
      }
      const fps = distance / time;
      resultDiv.textContent = `Speed: ${fps.toFixed(2)} feet/second`;
    });

    // Time to travel calculator
    const timeForm = document.getElementById('timeForm');
    const resultDiv2 = document.getElementById('result2');
    timeForm.addEventListener('submit', function(e) {
      e.preventDefault();
      const distance2 = parseFloat(document.getElementById('distance2').value);
      const fps = parseFloat(document.getElementById('fps').value);
      if (isNaN(distance2) || isNaN(fps) || fps <= 0) {
        resultDiv2.textContent = 'Please enter valid numbers.';
        return;
      }
      const time = distance2 / fps;
      resultDiv2.textContent = `Time: ${time.toFixed(2)} seconds`;
    });
  </script>
</body>
</html>
